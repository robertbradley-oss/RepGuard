name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run check:report-semantics
      - run: npm run check:receipt-regressions
      - run: npm run check:product-photo-probes
      - run: npm run check:vision-sandbox-skeleton
      - run: npm run check:vision-sandbox-fixture-runner
      - run: npm run check:vision-sandbox-boundaries
